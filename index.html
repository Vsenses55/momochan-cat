<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A sitting cat cut into steel plates in Three.js. Orbit it and hover the plates to play notes and wake translucent color.">
<title>Sliced Cat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700&family=Schibsted+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font-size: 14px; }
/* Layout: full-bleed WebGL plaza, quiet HUD pinned to top and bottom edges like a gallery placard */
:root {
  --bg: #faf5eb;          /* warm paper */
  --teal: #6aac99;
  --plum: #532376;
  --coral: #eb5f50;
  --ink: #2a1f33;
  --muted: #6e6474;
  --panel: rgba(250, 245, 235, 0.78);
  --rule: rgba(83, 35, 118, 0.16);
  --glint: #c79a5b;       /* late-sun reflection on steel */
  --f-display: "Big Shoulders Display", "Arial Narrow", sans-serif;
  --f-body: "Schibsted Grotesk", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  overflow: hidden;
}
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

.hud {
  position: fixed; inset: 0;
  display: flex; flex-direction: column; justify-content: space-between;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-bottom, 0px));
  pointer-events: none;
}
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.placard { max-width: 34ch; min-width: 0; }
.placard h1 {
  margin: 0; font-family: var(--f-display); font-weight: 700;
  font-size: clamp(34px, 6vw, 56px); line-height: 0.9; letter-spacing: 0.01em;
  text-transform: uppercase; text-wrap: balance;
}
.placard .meta {
  margin: 10px 0 0; font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--muted);
}
.placard p { margin: 8px 0 0; font-size: 14px; line-height: 1.45; color: var(--muted); }

button, .chip, input { pointer-events: auto; font: inherit; }
.sound {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-radius: 999px; border: 1px solid var(--rule);
  background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  color: var(--ink); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap;
}
.sound .bars { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; }
.sound .bars i { width: 2px; background: currentColor; height: 4px; border-radius: 1px; transition: height .2s; }
.sound[aria-pressed="true"] .bars i:nth-child(1) { height: 7px; }
.sound[aria-pressed="true"] .bars i:nth-child(2) { height: 12px; }
.sound[aria-pressed="true"] .bars i:nth-child(3) { height: 9px; }
.sound[aria-pressed="true"] .bars i:nth-child(4) { height: 5px; }

.bottom { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: center; gap: 12px; }
.vol { display: flex; align-items: center; gap: 8px; pointer-events: auto; }
.vol input[type="range"] { width: 110px; }
.controls {
  display: flex; flex-wrap: wrap; align-items: center; gap: 14px 18px;
  padding: 10px 14px; border-radius: 14px; border: 1px solid var(--rule);
  background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  pointer-events: auto;
}
.group { display: flex; align-items: center; gap: 8px; }
.label { font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.chips { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; padding: 2px; }
.chip {
  border: 0; background: transparent; color: var(--ink); cursor: pointer;
  padding: 5px 11px; border-radius: 999px; font-size: 13px;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
input[type="range"] { width: 120px; accent-color: var(--ink); }
.val { font-family: var(--f-mono); font-size: 12px; font-variant-numeric: tabular-nums; min-width: 2ch; }
.toggle {
  border: 1px solid var(--rule); background: transparent; color: var(--ink); cursor: pointer;
  padding: 5px 12px; border-radius: 999px; font-size: 13px;
}
.toggle[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--glint); outline-offset: 2px; }

.side { display: flex; flex-direction: column; align-items: flex-end; gap: 14px; }
.readout {
  font-family: var(--f-mono); font-size: 12px; font-variant-numeric: tabular-nums;
  color: var(--muted); text-align: right; line-height: 1.6;
}
.readout b { color: var(--ink); font-weight: 500; }
.readout .big { font-family: var(--f-display); font-size: 40px; line-height: 1; color: var(--ink); font-weight: 500; letter-spacing: 0.02em; }

/* Start-sound prompt: follows the cursor over the cat until sound is running */
.start {
  position: fixed; left: 0; top: 0; z-index: 5;
  display: inline-flex; align-items: center; gap: 10px;
  padding: 11px 16px; border: 1px solid var(--rule); border-radius: 999px;
  background: rgba(250, 245, 235, 0.94); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  color: var(--ink); cursor: pointer;
  font: 500 14px/1 var(--f-body); white-space: nowrap;
  box-shadow: 0 8px 24px -10px rgba(42, 31, 51, 0.35);
  transform: translate3d(var(--px, 50vw), var(--py, 62vh), 0) translate(-50%, -50%);
  transition: transform .45s cubic-bezier(.2,.8,.2,1), opacity .35s ease;
  pointer-events: auto;
}
.start.follow { transform: translate3d(var(--px), var(--py), 0) translate(22px, 18px); transition: transform .12s ease-out, opacity .35s ease; }
.start.gone { opacity: 0; pointer-events: none; }
.start .bars { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; }
.start .bars i { width: 2px; background: currentColor; border-radius: 1px; height: 4px; animation: eq 1.1s ease-in-out infinite; }
.start .bars i:nth-child(2) { animation-delay: -.3s; }
.start .bars i:nth-child(3) { animation-delay: -.6s; }
.start .bars i:nth-child(4) { animation-delay: -.15s; }
@keyframes eq { 0%, 100% { height: 4px } 50% { height: 12px } }
.sound.flash { animation: flash 1.6s ease-out 1; }
@keyframes flash { 0%, 60% { box-shadow: 0 0 0 0 rgba(235, 95, 80, .55), 0 0 0 3px var(--coral); } 100% { box-shadow: 0 0 0 14px rgba(235, 95, 80, 0), 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) { .start .bars i, .sound.flash { animation: none; } .start, .start.follow { transition: opacity .2s; } }
#status {
  position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
  font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
  pointer-events: none;
}

@media (max-width: 560px) {
  .placard p { display: none; }
  .readout .big { font-size: 30px; }
  input[type="range"] { width: 96px; }
}
</style>

</head>
<body>
<div id="stage"></div>
<div id="status">Cutting plates…</div>
<button class="start" id="startSound" type="button">
  <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
  Click to hear the cat
</button>

<div class="hud">
  <div class="top">
    <div class="placard">
      <div class="meta"><span id="metaCount">75</span> plates · <span id="figCut">cut side to side</span></div>
      <p>Drag to orbit. Run the cursor across the plates to play them. Turn it nose-on and the cat dissolves into lines.</p>
    </div>
    <div class="side">
    <button class="sound" id="sound" aria-pressed="true" type="button">
      <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span id="soundLabel">Sound</span>
    </button>
      <div class="vol">
        <label class="label" for="volume">Volume</label>
        <input type="range" id="volume" min="0" max="100" step="1" value="50">
        <span class="val" id="volVal">50</span>
      </div>
      <div class="readout" aria-live="polite">
        <div class="big" id="rNote">—</div>
        <div>plate <b id="rIdx">––</b> / <span id="rTotal">56</span> · x <b id="rX">+0.000</b> m</div>
      </div>
    </div>
  </div>

  <div class="bottom">
    <div class="controls">
      <div class="group">
        <span class="label">Rest</span>
        <div class="chips" role="group" aria-label="Resting finish">
          <button class="chip" type="button" data-rest="glass" aria-pressed="true">Glass</button>
          <button class="chip" type="button" data-rest="steel" aria-pressed="false">Steel</button>
        </div>
      </div>
      <div class="group">
        <span class="label">Color</span>
        <div class="chips" role="group" aria-label="Plate color">
          <button class="chip" type="button" data-color="gradient" aria-pressed="true">Gradient</button>
          <button class="chip" type="button" data-color="bands" aria-pressed="false">Bands</button>
          <button class="chip" type="button" data-color="prism" aria-pressed="false">Prism</button>
        </div>
      </div>
      <div class="group">
        <span class="label">Motion</span>
        <div class="chips" role="group" aria-label="Hover motion">
          <button class="chip" type="button" data-mode="ripple" aria-pressed="false">Ripple</button>
          <button class="chip" type="button" data-mode="slide" aria-pressed="false">Slide</button>
          <button class="chip" type="button" data-mode="tilt" aria-pressed="true">Tilt</button>
        </div>
      </div>
      <div class="group">
        <label class="label" for="count">Plates</label>
        <input type="range" id="count" min="24" max="96" step="1" value="75">
        <span class="val" id="countVal">75</span>
      </div>
      <button class="toggle" id="explode" type="button" aria-pressed="false">Explode</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const css = getComputedStyle(document.documentElement);
  const GLINT = new THREE.Color(css.getPropertyValue('--glint').trim() || '#c79a5b');

  /* ---------- Figure as a signed distance field (y up, z forward, x across) ---------- */
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  function cap(px, py, pz, a, b, ra, rb) {
    const bx = b[0]-a[0], by = b[1]-a[1], bz = b[2]-a[2];
    const qx = px-a[0], qy = py-a[1], qz = pz-a[2];
    const h = clamp((qx*bx+qy*by+qz*bz)/(bx*bx+by*by+bz*bz), 0, 1);
    const dx = qx-bx*h, dy = qy-by*h, dz = qz-bz*h;
    return Math.sqrt(dx*dx+dy*dy+dz*dz) - (ra + (rb-ra)*h);
  }
  function ell(px, py, pz, c, r) {
    const x = px-c[0], y = py-c[1], z = pz-c[2];
    const k0 = Math.sqrt((x/r[0])**2 + (y/r[1])**2 + (z/r[2])**2);
    const k1 = Math.sqrt((x/(r[0]*r[0]))**2 + (y/(r[1]*r[1]))**2 + (z/(r[2]*r[2]))**2);
    return k1 === 0 ? -Math.min(r[0], r[1], r[2]) : k0*(k0-1)/k1;
  }
  function smin(a, b, k) { const h = Math.max(k-Math.abs(a-b), 0)/k; return Math.min(a, b) - h*h*k*0.25; }

  // A seated, cross-legged figure with hands resting on the knees.
  function seated(x, y, z) {
    let d = ell(x,y,z,[0,0.30,-0.02],[0.30,0.17,0.22]);                       // pelvis
    d = smin(d, cap(x,y,z,[0,0.36,-0.03],[0,0.72,-0.01],0.19,0.155), 0.10);    // abdomen
    d = smin(d, ell(x,y,z,[0,0.86,0.0],[0.235,0.20,0.15]), 0.08);              // chest
    d = smin(d, cap(x,y,z,[-0.2,1.0,-0.02],[0.2,1.0,-0.02],0.075,0.075), 0.06); // shoulders
    d = smin(d, cap(x,y,z,[0,1.0,-0.01],[0,1.17,0.012],0.06,0.052), 0.05);     // neck
    d = smin(d, ell(x,y,z,[0,1.31,0.025],[0.098,0.135,0.118]), 0.04);          // head
    for (const s of [-1, 1]) {
      d = smin(d, cap(x,y,z,[s*0.25,0.98,-0.02],[s*0.31,0.70,0.06],0.058,0.047), 0.04);
      d = smin(d, cap(x,y,z,[s*0.31,0.70,0.06],[s*0.42,0.38,0.32],0.046,0.034), 0.03);
      d = smin(d, ell(x,y,z,[s*0.44,0.33,0.38],[0.042,0.03,0.07]), 0.03);
      d = smin(d, cap(x,y,z,[s*0.14,0.24,0.02],[s*0.56,0.15,0.40],0.115,0.075), 0.08); // thigh
    }
    d = smin(d, cap(x,y,z,[0.56,0.13,0.42],[-0.18,0.088,0.58],0.07,0.046), 0.05);  // right shin
    d = smin(d, ell(x,y,z,[-0.27,0.08,0.565],[0.11,0.038,0.048]), 0.03);
    d = smin(d, cap(x,y,z,[-0.56,0.12,0.40],[0.16,0.072,0.70],0.07,0.044), 0.05);  // left shin
    d = smin(d, ell(x,y,z,[0.25,0.065,0.705],[0.11,0.034,0.046]), 0.03);
    return Math.max(d, 0.004 - y); // flat underside on the plinth
  }

  // Standing in contrapposto, arms raised into a ring overhead (figure faces +z, x across).
  function reachingBody(x, y, z) {
    let d = ell(x,y,z,[0,0.98,0],[0.17,0.12,0.11]);                            // pelvis
    d = smin(d, cap(x,y,z,[0,1.02,0],[0,1.32,0.01],0.13,0.12), 0.08);          // abdomen
    d = smin(d, ell(x,y,z,[0,1.42,0.01],[0.17,0.15,0.11]), 0.07);              // chest
    d = smin(d, cap(x,y,z,[-0.17,1.55,0],[0.17,1.55,0],0.055,0.055), 0.05);   // shoulders
    d = smin(d, cap(x,y,z,[0,1.55,0],[0,1.67,0.012],0.046,0.042), 0.04);       // neck
    d = smin(d, ell(x,y,z,[0,1.79,0.02],[0.08,0.108,0.095]), 0.03);            // head
    for (const s of [-1, 1]) {
      d = smin(d, cap(x,y,z,[s*0.18,1.57,0],[s*0.27,1.88,0.01],0.046,0.037), 0.035); // upper arm
      d = smin(d, cap(x,y,z,[s*0.27,1.88,0.01],[s*0.075,2.13,0.02],0.035,0.027), 0.025); // forearm
      d = smin(d, ell(x,y,z,[s*0.035,2.19,0.02],[0.028,0.065,0.022]), 0.02);   // hands meet
    }
    // weight leg (-x) straight, free leg (+x) relaxed with bent knee
    d = smin(d, cap(x,y,z,[-0.085,0.95,0],[-0.08,0.51,0.012],0.092,0.06), 0.06);
    d = smin(d, cap(x,y,z,[-0.08,0.51,0.012],[-0.075,0.075,-0.01],0.056,0.036), 0.04);
    d = smin(d, ell(x,y,z,[-0.075,0.035,0.055],[0.04,0.035,0.105]), 0.03);
    d = smin(d, cap(x,y,z,[0.085,0.94,0],[0.13,0.52,0.07],0.088,0.058), 0.06);
    d = smin(d, cap(x,y,z,[0.13,0.52,0.07],[0.12,0.09,0.0],0.054,0.035), 0.04);
    d = smin(d, ell(x,y,z,[0.135,0.04,0.065],[0.04,0.035,0.1]), 0.03);
    return Math.max(d, 0.004 - y);
  }
  // Cut front to back: the slicing axis is the body's depth.
  const reaching = (a, y, b) => reachingBody(b, y, a);

  // A large head and shoulders, cut side to side like a contour map of a profile.
  function head(x, y, z) {
    let d = ell(x,y,z,[0,1.0,0],[0.34,0.44,0.42]);                              // cranium
    d = smin(d, ell(x,y,z,[0,0.78,0.12],[0.27,0.32,0.3]), 0.12);                // face and jaw
    d = smin(d, ell(x,y,z,[0,1.03,0.33],[0.26,0.055,0.08]), 0.06);              // brow
    d = smin(d, cap(x,y,z,[0,0.95,0.41],[0,0.81,0.48],0.024,0.052), 0.04);      // nose
    d = smin(d, ell(x,y,z,[0,0.68,0.39],[0.09,0.03,0.04]), 0.03);               // lips
    d = smin(d, ell(x,y,z,[0,0.56,0.3],[0.12,0.08,0.1]), 0.06);                 // chin
    for (const s of [-1, 1]) {
      d = smin(d, ell(x,y,z,[s*0.34,0.88,-0.02],[0.05,0.11,0.07]), 0.04);      // ears
      const ex = x-s*0.13, ey = y-0.93, ez = z-0.40;
      d = Math.max(d, -(Math.sqrt(ex*ex+ey*ey+ez*ez) - 0.062));                 // eye sockets
    }
    d = smin(d, cap(x,y,z,[0,0.62,-0.05],[0,0.12,-0.04],0.19,0.2), 0.08);       // neck
    d = smin(d, ell(x,y,z,[0,0.1,-0.05],[0.62,0.16,0.28]), 0.12);               // shoulders
    return Math.max(d, 0.004 - y);
  }

  // A sitting cat in profile, facing +z, about 1.5 m to the ear tips. Width runs along x.
  const TAIL = [[-0.525,0.084],[-0.714,0.242],[-0.777,0.47],[-0.70,0.66],[-0.745,0.756],[-0.835,0.815]];
  function cat(x, y, z) {
    let d = ell(x,y,z,[0,0.39,-0.27],[0.285,0.39,0.3]);                         // haunch
    d = smin(d, ell(x,y,z,[0,0.13,-0.24],[0.26,0.14,0.31]), 0.12);               // seat
    d = smin(d, ell(x,y,z,[0,0.42,-0.03],[0.235,0.28,0.28]), 0.2);               // belly
    d = smin(d, ell(x,y,z,[0,0.72,0.2],[0.205,0.3,0.24]), 0.24);                 // chest and shoulders
    // Thick neck with a near-vertical nape; the throat curves in under the jaw.
    d = smin(d, cap(x,y,z,[0,0.84,0.07],[0,1.13,0.19],0.2,0.17), 0.12);           // neck
    d = smin(d, ell(x,y,z,[0,1.09,0.1],[0.17,0.16,0.13]), 0.1);                  // nape, full and rounded
    d = smin(d, ell(x,y,z,[0,1.22,0.26],[0.215,0.13,0.17]), 0.12);               // cranium
    d = smin(d, ell(x,y,z,[0,1.255,0.355],[0.17,0.07,0.075]), 0.05);             // forehead and brow
    d = smin(d, ell(x,y,z,[0,1.1,0.33],[0.16,0.08,0.13]), 0.08);                 // jaw
    d = smin(d, ell(x,y,z,[0,1.15,0.44],[0.09,0.052,0.065]), 0.035);             // muzzle, set below the stop
    d = smin(d, ell(x,y,z,[0,1.168,0.49],[0.034,0.026,0.024]), 0.015);           // nose tip, slightly upturned
    d = smin(d, ell(x,y,z,[0,1.073,0.43],[0.07,0.038,0.055]), 0.03);             // chin
    d = Math.max(d, -cap(x,y,z,[-0.06,1.113,0.506],[0.06,1.113,0.506],0.017,0.017)); // mouth line
    for (const s of [-1, 1]) {
      d = smin(d, ell(x,y,z,[s*0.1,1.1,0.32],[0.12,0.1,0.13]), 0.1);             // cheeks
      d = smin(d, cap(x,y,z,[s*0.13,1.27,0.24],[s*0.175,1.47,0.265],0.07,0.008), 0.035); // ears, set wide and tipped out
    }
    for (const s of [-1, 1]) {
      d = smin(d, cap(x,y,z,[s*0.065,0.62,0.15+(s>0?0.05:0)],[s*0.065,0.06,0.17+(s>0?0.05:0)],0.06,0.045), 0.04); // front legs
      d = smin(d, ell(x,y,z,[s*0.065,0.035,0.26],[0.045,0.035,0.075]), 0.03);  // front paws
      d = smin(d, cap(x,y,z,[s*0.17,0.16,-0.17],[s*0.17,0.04,0.0],0.07,0.042), 0.06); // hind feet
      d = smin(d, ell(x,y,z,[s*0.17,0.03,0.0],[0.05,0.035,0.1]), 0.04);        // hind paws
    }
    for (let k = 0; k < TAIL.length-1; k++) {
      const a = TAIL[k], b = TAIL[k+1], t0 = k/(TAIL.length-1), t1 = (k+1)/(TAIL.length-1);
      // centered on the spine, drifting only slightly to one side toward the tip
      d = smin(d, cap(x,y,z,[-0.05*t0,a[1],a[0]],[-0.05*t1,b[1],b[0]],0.054-0.014*t0,0.054-0.014*t1), k === 0 ? 0.08 : 0.025);
    }
    return Math.max(d, 0.004 - y);

    else if (mode === 'slide') s.vz += 0.75*w*k;
    else s.vr += -1.4*w*k;
    s.glow = Math.max(s.glow, w);
  }

  function onPointer(e) {
    const rect = renderer.domElement.getBoundingClientRect();
    ptr.set(((e.clientX-rect.left)/rect.width)*2-1, -((e.clientY-rect.top)/rect.height)*2+1);
    ray.setFromCamera(ptr, camera);
    const hit = ray.intersectObjects(slices.map(s => s.mesh), false)[0];
    const s = hit ? hit.object.userData.slice : null;
    renderer.domElement.style.cursor = s ? 'crosshair' : 'grab';
    if (e.pointerType === 'mouse') {   // the start prompt rides along with the cursor over the cat
      startBtn.style.setProperty('--px', e.clientX + 'px');
      startBtn.style.setProperty('--py', e.clientY + 'px');
      startBtn.classList.toggle('follow', !!s);
      if (!s) { startBtn.style.removeProperty('--px'); startBtn.style.removeProperty('--py'); }
    }
    if (s && s !== hovered) {
      excite(s, performance.now()/1000);
      strike(s, hit.point.y);
      const n = noteFor(s.idx, slices.length);
      rNote.textContent = n.name;
      rIdx.textContent = String(s.idx + 1).padStart(2, '0');
      rX.textContent = (s.x >= 0 ? '+' : '−') + Math.abs(s.x).toFixed(3);
    }
    hovered = s;
  }
  renderer.domElement.addEventListener('pointermove', onPointer);
  renderer.domElement.addEventListener('pointerdown', onPointer);
  renderer.domElement.addEventListener('pointerleave', () => {
    hovered = null;
    startBtn.classList.remove('follow'); startBtn.style.removeProperty('--px'); startBtn.style.removeProperty('--py');
  });

  document.querySelectorAll('.chip[data-rest]').forEach(b => b.addEventListener('click', () => {
    SHARED.uIdle.value = b.dataset.rest === 'glass' ? 1 : 0;
    document.querySelectorAll('.chip[data-rest]').forEach(c => c.setAttribute('aria-pressed', String(c === b)));
  }));
  document.querySelectorAll('.chip[data-color]').forEach(b => b.addEventListener('click', () => {
    colorMode = b.dataset.color;
    document.querySelectorAll('.chip[data-color]').forEach(c => c.setAttribute('aria-pressed', String(c === b)));
    applyColors();
  }));
  document.querySelectorAll('.chip[data-mode]').forEach(b => b.addEventListener('click', () => {
    mode = b.dataset.mode;
    document.querySelectorAll('.chip[data-mode]').forEach(c => c.setAttribute('aria-pressed', String(c === b)));
  }));
  document.querySelectorAll('.chip[data-fig]').forEach(b => b.addEventListener('click', () => {
    if (FIGS[b.dataset.fig] === fig) return;
    document.querySelectorAll('.chip[data-fig]').forEach(c => c.setAttribute('aria-pressed', String(c === b)));
    selectFigure(b.dataset.fig);
  }));

  function frame() {
    controls.target.set(...fig.target);
    camera.position.set(...fig.cam);
    controls.maxDistance = 7;
    controls.update();
  }
  function selectFigure(key) {
    fig = FIGS[key]; figure = fig.sdf;
    X0 = fig.x0; X1 = fig.x1; setGrid(fig.grid);
    document.getElementById('figName').textContent = fig.name;
    document.getElementById('figCut').textContent = fig.cut;
    count.value = fig.plates; countVal.textContent = fig.plates;
    fitPlinth(fig.plinth); frame();
    rebuild(fig.plates);
  }
  const explodeBtn = document.getElementById('explode');
  explodeBtn.addEventListener('click', () => {
    explodeTarget = explodeTarget ? 0 : 1;
    explodeBtn.setAttribute('aria-pressed', String(!!explodeTarget));
  });
  const count = document.getElementById('count'), countVal = document.getElementById('countVal');
  count.addEventListener('input', () => countVal.textContent = count.value);
  count.addEventListener('change', () => rebuild(+count.value));

  const status = document.getElementById('status');
  function rebuild(N) {
    status.hidden = false; status.textContent = `Cutting ${N} plates…`;
    setTimeout(() => { build(N); status.hidden = true; if (!reduceMotion) explode = 1; }, 30);
  }

  /* ---------- Loop ---------- */
  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w/h;
    camera.fov = w < 600 ? 42 : 32;
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage); resize();

  const clock = new THREE.Clock();
  function tick() {
    const dt = Math.min(clock.getDelta(), 1/30), now = performance.now()/1000;
    for (let k = pending.length-1; k >= 0; k--) if (pending[k].at <= now) { applyImpulse(pending[k].s, pending[k].w); pending.splice(k, 1); }
    explode += (explodeTarget - explode) * Math.min(1, dt*3.2);
    if (hovered) for (let d = -4; d <= 4; d++) {
      const t = slices[hovered.idx + d]; if (t) t.heat = Math.max(t.heat, Math.exp(-(d*d)/7));
    }
    const K = 70, C = 7;
    for (const s of slices) {
      s.vy += (-K*s.y - C*s.vy)*dt; s.y += s.vy*dt;
      s.vz += (-K*s.z - C*s.vz)*dt; s.z += s.vz*dt;
      s.vr += (-K*s.r - C*s.vr)*dt; s.r += s.vr*dt;
      s.glow *= Math.exp(-dt*2.6);
      s.mesh.position.set(s.x*(1 + explode*fig.spread), s.y, s.z);
      s.mesh.rotation.x = s.r*0.12;
      // Color eases in quickly on hover and fades out slowly once the cursor moves on.
      const target = Math.max(s.heat, s.glow*0.6);
      s.tint += (target - s.tint) * Math.min(1, dt*(target > s.tint ? 12 : 1.6));
      s.heat = 0;
      s.mesh.material.userData.uTint.value = s.tint;
    }
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }

  fitPlinth(fig.plinth); frame();
  setTimeout(() => { build(fig.plates); status.hidden = true; if (!reduceMotion) explode = 1; tick(); }, 30);
})();
</script>

</body>
</html>
